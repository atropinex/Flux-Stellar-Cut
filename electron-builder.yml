appId: com.flux.stellarcut
productName: Flux-Stellar-Cut
directories:
  output: dist
files:
  - out/**
  - package.json
# ffmpeg and ffprobe are real programs, so they cannot stay inside the asar archive.
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**
fileAssociations:
  - ext: stellarproj
    name: Flux-Stellar-Cut Project
    role: Editor
win:
  target:
    - msi
msi:
  upgradeCode: "{12345678-ABCD-1234-ABCD-123456789ABC}"
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target: dmg
  category: public.app-category.video
linux:
  target: AppImage
  category: AudioVideo